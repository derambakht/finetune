# 16-bit LoRA on Llama 3.1 8B Instruct with a ShareGPT dataset (24 GB GPU)
# Llama is gated: set HF_TOKEN in the environment or paste the token in the UI.
model:
  model_name: unsloth/Meta-Llama-3.1-8B-Instruct
  max_seq_length: 4096
  quantization: 16bit
  chat_template: llama-3.1
dataset:
  source: huggingface
  path: mlabonne/FineTome-100k
  split: train
  format: sharegpt
  max_samples: 20000
  eval_ratio: 0.02
lora:
  r: 32
  alpha: 32
  use_rslora: false
training:
  run_name: llama31-8b-finetome
  num_train_epochs: 1
  max_steps: 0
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.0001
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  warmup_steps: 0
  train_on_responses_only: true
  eval_steps: 100
  save_steps: 250
  report_to: tensorboard
export:
  methods: [lora, merged_16bit]
